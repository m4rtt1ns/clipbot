name: clipbot
on:
  schedule:
    - cron: "5 * * * *"      # roda de hora em hora
  workflow_dispatch:
    inputs:
      test:
        description: "Modo teste (4 min, 1 clipe, so Telegram)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: clipbot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar ffmpeg e fontes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: Rodar clipbot
        env:
          TEST_MODE: ${{ inputs.test && '1' || '0' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          TT_PRIVACY: ${{ vars.TT_PRIVACY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m clipbot.main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips
          path: out/
          retention-days: 3
          if-no-files-found: ignore
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
